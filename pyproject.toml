[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "harness4codex"
version = "0.1.0"
description = "Codex-native workflow harness with hooks, state, skills, and guardrails."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Lharden" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --basetemp .pytest_tmp_codex"
